name: ${PREFIX:-cel4postgres}

# The database exists to be thrown away. PGDATA is a tmpfs, so every
# `docker compose down` discards it and every `up` starts from initdb
# with the schema reinstalled -- there is no volume to remember to
# delete, and no way for a stale schema to survive into a test run.
services:
  postgres:
    container_name: ${PREFIX:-cel4postgres}-postgres
    environment:
      PGDATA: /var/lib/postgresql/data
      POSTGRES_DB: ${POSTGRES_DB:-cel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_USER: ${POSTGRES_USER:-cel}
    # Readiness means installed, not merely listening. The image runs
    # /docker-entrypoint-initdb.d over a socket-only server before it
    # opens for connections, so a bare pg_isready can go green while
    # sql/ has not been applied yet. Selecting cel.version() closes
    # that race: the container is healthy exactly when the schema is
    # there, and `--wait` therefore means what a caller assumes.
    healthcheck:
      interval: 2s
      retries: 30
      start_period: 20s
      test:
        - CMD-SHELL
        - >-
          pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB} -q &&
          psql -U $${POSTGRES_USER} -d $${POSTGRES_DB} -tAc
          'SELECT cel.version()' >/dev/null
      timeout: 5s
    image: postgres:18-alpine@sha256:d3e1620b530c944afa6e887d22eb899824da68e19c52024bf98f5220c88a65b2
    ports:
      # Host side is configurable; container side is always 5432.
      - ${POSTGRES_PORT:-5432}:5432
    restart: unless-stopped
    tmpfs:
      - /var/lib/postgresql/data
    volumes:
      # PGDATA is a tmpfs, so the data directory is empty on every
      # start and the image re-runs these on every start. Installing
      # the schema is therefore part of bringing the database up --
      # there is no second step to forget, and no stale schema.
      - ./sql:/docker-entrypoint-initdb.d:ro

  # The suite, containerised, for CI parity and for running without a
  # Go toolchain on the host. Behind a profile so the default `up`
  # brings up the database without running tests:
  #   docker compose run --rm test
  test:
    command: go test ./...
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      CEL_EXPR_DIR: /cel-expr
      DATABASE_URL: postgres://${POSTGRES_USER:-cel}:${POSTGRES_PASSWORD:-password}@postgres:5432/${POSTGRES_DB:-cel}?sslmode=disable
      GOCACHE: /tmp/go-build
      GOFLAGS: -mod=mod
      GOMODCACHE: /tmp/go-mod
    image: golang:1.26-alpine
    profiles:
      - test
    volumes:
      - ./:/src
      # The conformance corpus, read-only, from the host's checkout
      # directory (.env). An empty mount just makes the suite name
      # CEL_EXPR_DIR as the fix.
      - ${CEL_EXPR_DIR:-./.cel-expr}:/cel-expr:ro
    working_dir: /src
